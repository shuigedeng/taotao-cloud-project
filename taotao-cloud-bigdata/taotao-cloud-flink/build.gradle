// ============================================================
// application 插件配置：用于本地 gradle run 调试
// ============================================================
application {
    // 指定本地运行时的主类
    mainClass = 'com.example.YourFlinkJob'
}

// ============================================================
// 本地开发环境配置：让 flinkShadowJar 中的依赖在 IDE 中可用
// ============================================================
sourceSets {
    main {
        compileClasspath += configurations.flinkShadowJar
        runtimeClasspath += configurations.flinkShadowJar
    }
    test {
        compileClasspath += configurations.flinkShadowJar
        runtimeClasspath += configurations.flinkShadowJar
    }
//    javadoc {
//        classpath += configurations.flinkShadowJar
//    }
}
// 让 gradle run 命令也能识别这些依赖
run.classpath = sourceSets.main.runtimeClasspath

shadowJar {
    // 关键配置：只打包 flinkShadowJar 中的依赖
    configurations = [project.configurations.flinkShadowJar]

    zip64 true
    archiveBaseName.set('my-flink-job')
    archiveClassifier.set('')
    archiveVersion.set('1.0.0')

    // 3. 合并 SPI 服务文件（如 META-INF/services/）
    duplicatesStrategy = DuplicatesStrategy.WARN
    mergeServiceFiles()
    filesNotMatching("META-INF/services/**") {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    // 4. 排除签名文件，避免安全冲突
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    // 5. 排除 POM 文件，精简 Jar 包
    exclude '**/pom.properties'
    exclude '**/pom.xml'

    // 6. (可选) 如果在运行时出现类冲突，可以重定位包名
    //    relocate 'org.apache.http', 'my.shadow.http'

    // 7. (可选) 在 Manifest 中指定默认主类
    //    仅在使用 java -jar 或 Web UI 默认选项时生效
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

