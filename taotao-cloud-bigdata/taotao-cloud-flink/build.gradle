apply plugin: "scala"
apply plugin: 'java'
apply plugin: 'application'
apply plugin: "idea"

configurations {
    flinkShadowJar {
        // 这些 Flink 集群已提供，排除掉防止冲突
        exclude group: 'org.apache.flink', module: 'force-shading'
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'org.slf4j'
        exclude group: 'org.apache.logging.log4j'
    }

    configureEach {
        resolutionStrategy.cacheChangingModulesFor 0, "seconds"
        resolutionStrategy.cacheDynamicVersionsFor 0, "seconds"

        resolutionStrategy {
            force 'org.glassfish:javax.el:3.0.0'
            force 'org.glassfish.jaxb:jaxb-runtime:4.0.9'
            force 'org.lz4:lz4-java:1.8.1'
        }

        exclude group: "at.yawk.lz4", module: "lz4-java"
    }
}

tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.additionalParameters = ['-unchecked', '-deprecation']
}

